port: 7880
bind_addresses:
  - 0.0.0.0

rtc:
  # Compose supplies --node-ip from ORAVI_LAN_IP. Do not advertise Docker's
  # private address or discover an Internet address for this LAN-only setup.
  use_external_ip: false
  # Retain an internal candidate for Egress in the same Docker network.
  advertise_internal_ip: true
  tcp_port: 7881
  port_range_start: 51000
  port_range_end: 51100

redis:
  address: redis:6379

keys:
  devkey: secret

