org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Flutter 3.47's Gradle plugin still requires the legacy AGP DSL.
android.newDsl=false
# AGP 9 provides Kotlin directly; FlutterFire supports this mode.
android.builtInKotlin=true
# Avoid Kotlin incremental-cache collisions when Windows project and Pub paths use different drives.
kotlin.compiler.execution.strategy=in-process
kotlin.incremental=false
